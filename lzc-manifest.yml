usage: |
  KanaDojo 是日语假名与汉字的学习道场，打开浏览器就能练，不需要注册账号。

  - 首页是五十音图，点任意假名可以听发音、看笔顺。
  - 顶部菜单进入「假名」「汉字」「词汇」「打字」等练习：选好范围后直接开始作答，
    答完立刻出对错与得分。
  - 连对会累积连击和成就，「统计」页能看每天练了多少。

  语言与数据：

  - 界面跟随浏览器语言，中文环境下打开就是简体中文；也可以在「设置」里手动切换。
  - 练习进度与设置保存在当前浏览器本地，换浏览器或清空浏览器数据会重新开始。
  - 应用不需要联网也能打开和使用，发音是随包内置的音频文件。
application:
  subdomain: kanadojo
  routes:
    - /=http://web.cloud.lazycat.app.kana-dojo.lzcapp:3000
  health_check:
    test_url: http://web.cloud.lazycat.app.kana-dojo.lzcapp:3000/
    start_period: 60s
    timeout: 10s
    disable: false
services:
  web:
    # upstream: kanadojo-kd-v8-1019-1717
    image: registry.lazycat.cloud/wans/kanadojo-kd-v8-1019-1717:60c7cf138e667700
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 20
